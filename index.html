<body>
<title>Historia Clínica Etológica UTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f5f7f9;--surface:#ffffff;--surface-2:#e9eef4;--ink:#1f2a37;--muted:#5b6b7a;--line:#d5dde5;
  --navy:#16324f;--teal:#1a8c8c;--teal-tint:#e2f1f1;--coral:#c9533e;--coral-tint:#fbe8e4;--amber:#b9770e;--amber-tint:#fcf0dc;
  --bubble-me:#16324f;--bubble-me-ink:#ffffff;--focus:#1a8c8c;
  --f-display:"Source Serif 4",Cambria,Georgia,serif;
  --f-body:"Source Sans 3",Calibri,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1720;--surface:#16212d;--surface-2:#1d2b3a;--ink:#e6edf3;--muted:#9fb0c0;--line:#2b3b4c;
  --navy:#9ec3e8;--teal:#4fc1c1;--teal-tint:#173434;--coral:#f08a74;--coral-tint:#3a221d;--amber:#f0b54e;--amber-tint:#3a2d14;
  --bubble-me:#2a4a6c;--bubble-me-ink:#ffffff;--focus:#4fc1c1;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1720;--surface:#16212d;--surface-2:#1d2b3a;--ink:#e6edf3;--muted:#9fb0c0;--line:#2b3b4c;
  --navy:#9ec3e8;--teal:#4fc1c1;--teal-tint:#173434;--coral:#f08a74;--coral-tint:#3a221d;--amber:#f0b54e;--amber-tint:#3a2d14;
  --bubble-me:#2a4a6c;--bubble-me-ink:#ffffff;--focus:#4fc1c1;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem)} h2{font-size:1.35rem} h3{font-size:1.08rem}
p{margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid transparent;padding:.6rem 1rem;font-weight:600}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.btn{background:var(--navy);color:var(--surface)}
.btn-teal{background:var(--teal);color:var(--surface)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-coral{background:var(--coral);color:var(--surface)}
.btn-sm{font-size:.82rem;padding:.3rem .65rem}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;width:100%}
textarea{resize:vertical;min-height:5.2rem}
label{font-weight:600;font-size:.92rem;display:block;margin-bottom:.3rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:2px}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:0 0 20px}
.steps li{display:flex;align-items:center;gap:6px;font-size:.88rem;padding:.35rem .7rem;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps li b{font-family:var(--f-mono);font-size:.8rem}
.steps li.on{background:var(--navy);color:var(--surface)}
.steps li.done{background:var(--teal-tint);color:var(--teal)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.grid-eq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.grid-eq{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{border-radius:10px;padding:.75rem 1rem;font-size:.95rem}
.notice.warn{background:var(--amber-tint);color:var(--ink)}
.notice.err{background:var(--coral-tint);color:var(--ink)}
.notice.info{background:var(--teal-tint);color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
@media(max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.flow{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.flow li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:10px;align-items:start}
.flow .n{width:2rem;height:2rem;border-radius:50%;background:var(--navy);color:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem}
.species{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.species button{background:var(--surface-2);color:var(--ink);border:2px solid transparent;padding:1rem;text-align:left}
.species button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-tint)}
.species small{display:block;font-weight:400;color:var(--muted)}
.chat{display:flex;flex-direction:column;height:min(68vh,640px);min-height:420px}
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 12px}
.msg{max-width:85%;padding:.6rem .85rem;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:4px}
.msg.tu{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.hint{align-self:center;background:var(--amber-tint);font-size:.92rem;max-width:95%}
.who{font-size:.75rem;font-weight:700;opacity:.8;display:block;margin-bottom:2px}
.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.composer textarea{min-height:3rem;height:3rem}
.say{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:.78rem;padding:.15rem .55rem;border-radius:99px;margin-top:6px;font-weight:600}
.voz[aria-pressed="true"]{background:var(--teal-tint);border-color:var(--teal);color:var(--teal)}
.dictado{font-size:.86rem;color:var(--muted);margin-top:6px}
.typing{align-self:flex-start;color:var(--muted);font-style:italic;font-size:.92rem}
.ficha dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.ficha dt{color:var(--muted);font-size:.9rem} .ficha dd{margin:0;font-weight:600}
.guide{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.guide label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:0;font-size:.95rem}
.guide input{width:auto;margin-top:.25rem}
.counter{display:flex;gap:16px;flex-wrap:wrap}
.counter div{display:flex;flex-direction:column}
.counter .mono{font-size:1.2rem;color:var(--navy)}
.sec{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.sec-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.15rem .55rem;border-radius:999px}
.tag.cp{background:var(--teal-tint);color:var(--teal)}.tag.cf{background:var(--coral-tint);color:var(--coral)}.tag.mx{background:var(--amber-tint);color:var(--amber)}.tag.an{background:var(--surface-2);color:var(--navy)}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.fb{border-radius:10px;padding:.6rem .8rem;font-size:.95rem;background:var(--amber-tint)}
.fb.ok{background:var(--teal-tint)}
.fb b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.group-title{margin-top:8px;display:flex;align-items:center;gap:10px}
details.transcript{border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:var(--surface)}
details.transcript summary{cursor:pointer;font-weight:600}
.tx{max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:.93rem}
.tx p b{color:var(--navy)}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:12px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stat .mono{font-size:1.6rem;color:var(--navy);display:block}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;background:var(--teal)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.cat{font-size:.88rem;background:var(--surface-2);border-radius:8px;padding:.45rem .6rem;display:flex;justify-content:space-between;gap:8px}
.decl{font-size:.93rem;background:var(--surface-2);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover{background:var(--surface-2)}
.pill{font-size:.78rem;padding:.12rem .5rem;border-radius:99px;background:var(--surface-2);white-space:nowrap}
.pill.fin{background:var(--teal-tint);color:var(--teal)}
.pill.inc{background:var(--amber-tint);color:var(--amber)}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal .panel{max-width:480px;width:100%}
.quiz{display:flex;flex-direction:column;gap:14px}
.qitem{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.qitem legend{font-weight:600;padding:0;margin-bottom:4px;display:flex;gap:10px}
.qitem legend .mono{color:var(--teal)}
.qitem fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:0;padding:.5rem .7rem;border-radius:8px;background:var(--surface-2);cursor:pointer}
.opt input{width:auto;margin-top:.3rem}
.opt.ok{background:var(--teal-tint);outline:2px solid var(--teal)}
.opt.bad{background:var(--coral-tint);outline:2px solid var(--coral)}
.nota{display:flex;align-items:baseline;gap:6px}
.nota .mono{font-size:2.6rem;color:var(--navy);line-height:1}
.drop{border:2px dashed var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.drop.on{border-color:var(--teal);background:var(--teal-tint)}
.miembros{display:flex;flex-direction:column;gap:8px}
.miembro{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:8px;align-items:center}
.miembro .n{width:2rem;height:2rem;border-radius:50%;background:var(--surface-2);color:var(--navy);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem}
.pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.integrantes{margin:0;padding-left:1.1rem}
@media(prefers-reduced-motion:no-preference){.msg{animation:in .18s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Etología Animal · Temas 1.2 y 1.3 · Uso acotado de IA (IAA)</span>
      <h1>Historia Clínica Etológica</h1>
    </div>
    <div class="row">
      <button id="btnDocente" hidden class="btn-ghost btn-sm">Acceso docente</button>
      <button id="btnAlumno" hidden class="btn-ghost btn-sm">← Volver a la práctica</button>
    </div>
  </header>
  <ol class="steps" id="steps" aria-label="Fases de la práctica">
    <li data-f="repaso"><b>1</b> Repaso 1.2</li>
    <li data-f="entrevista"><b>2</b> Entrevista</li>
    <li data-f="redaccion"><b>3</b> Redacción sin IA</li>
    <li data-f="retro"><b>4</b> Retroalimentación</li>
    <li data-f="revision"><b>5</b> Revisión</li>
    <li data-f="final"><b>6</b> Entrega</li>
  </ol>
  <main id="app"></main>
</div>
<div id="modal"></div>

<script>
const CASES = [
{
  id:"canela",especie:"Perro",paciente:"Canela",resumen:"Hembra mestiza de 4 años",
  tutor:{nombre:"Gabriela Andrade",rol:"tutora",personalidad:"Contadora de 34 años, cariñosa y algo ansiosa; habla rápido, se justifica y siente culpa por dejar sola a la perra. Usa expresiones como \"la pobre\", \"mi bebé\". Tiende a decir que Canela \"se venga\" cuando la deja sola."},
  recepcion:"La tutora indica que la perra \"hace destrozos en la casa\".",
  saludo:"Buenos días, doctora... doctor. Vengo por Canela, ya no sé qué hacer con ella, me está destrozando el departamento.",
  hechos:[
    ["d1","datos",1,"Hembra mestiza (parece mezcla de beagle), 4 años, 12 kg, esterilizada a los 7 meses porque la fundación lo exigía."],
    ["d2","datos",1,"Adoptada a los 3 meses en una fundación de Santo Domingo, en 2022."],
    ["m1","motivo",1,"Desde hace unos 2 meses, cuando se queda sola, rasca y muerde la puerta de entrada (ya rompió el marco) y aúlla; los vecinos se quejaron."],
    ["m2","motivo",1,"Empezó cuando la tutora volvió a trabajar presencial; antes trabajaba desde casa y casi nunca la dejaba sola."],
    ["m3","motivo",0,"La tutora cree que Canela \"lo hace por venganza\" porque \"se pone celosa\" cuando ella sale."],
    ["o1","objetivo",1,"Quiere que Canela pueda quedarse tranquila sola unas 8 horas sin romper nada ni molestar a los vecinos."],
    ["a1","antecedentes",1,"Es la primera consulta por esto. Le dio unas gotas \"naturales\" de valeriana que compró en una tienda de mascotas durante 3 semanas, sin resultado."],
    ["a2","antecedentes",1,"Al llegar y encontrar destrozos la regaña y le muestra lo que rompió; la perra se agacha y \"pone cara de culpa\"."],
    ["s1","salud",0,"Vacunas al día, desparasitada hace 2 meses, sin enfermedades conocidas ni medicación."],
    ["v1","vida",1,"Vive en un departamento de 2 dormitorios en un tercer piso, sin patio."],
    ["v2","vida",1,"Rutina: paseo de 10 minutos a las 6:30, queda sola de 7:30 a 17:30 y otro paseo corto en la noche."],
    ["c1","convivencia",0,"Vive sola con la tutora; el novio la visita los fines de semana y Canela se lleva bien con él. No hay otros animales."],
    ["am1","ambiente",1,"La adoptó durante una época en que casi no salían ni recibían visitas; de cachorra tuvo poco contacto con otras personas y lugares."],
    ["am2","ambiente",0,"No tiene juguetes interactivos; tiene una pelota que no usa."],
    ["al1","alimentario",1,"Cuando se queda sola no toca la comida; come todo apenas la tutora regresa."],
    ["al2","alimentario",0,"Croquetas secas dos veces al día en plato de plástico en la cocina."],
    ["di1","dipsico",0,"Un plato de agua de acero en la cocina; toma normal."],
    ["so1","somato",0,"No se lame ni se rasca más de lo normal."],
    ["e1","eliminatorio",1,"A veces orina cerca de la puerta cuando está sola; con la tutora presente nunca elimina dentro."],
    ["su1","sueno",1,"Duerme en la cama de la tutora; la sigue de una habitación a otra, incluso al baño."],
    ["ag1","agresion",0,"Nunca ha agredido a personas ni a perros."],
    ["ex1","exploratorio",1,"Cuando la tutora se prepara para salir (llaves, zapatos) Canela jadea, babea y se pega a ella; el vecino la ha oído aullar a los pocos minutos de quedar sola."],
    ["ex2","exploratorio",0,"En el paseo va con la nariz al suelo, tranquila, y saluda a otros perros."],
    ["j1","juego",0,"Juega a perseguir una media con la tutora; no le interesan los juguetes cuando está sola."],
    ["sx1","sexual",0,"Esterilizada; no monta."],
    ["ot1","otros",0,"Le tiene miedo a los voladores (fuegos artificiales) en diciembre; se esconde debajo de la cama."],
  ]
},
{
  id:"thor",especie:"Perro",paciente:"Thor",resumen:"Macho mestizo de 3 años",
  tutor:{nombre:"Fernando Zambrano",rol:"tutor",personalidad:"Comerciante de 45 años, directo, algo brusco y orgulloso de sus perros. Minimiza los problemas (\"son cosas de machos\") y se resiste a la idea de castrar. Habla con frases cortas."},
  recepcion:"El tutor indica que sus dos perros \"se pelean\".",
  saludo:"Buenas. Traigo a Thor porque se pelea con el otro perro de la casa, Max. Mi esposa ya está cansada.",
  hechos:[
    ["d1","datos",1,"Thor: macho entero, mestizo de pastor alemán, 3 años, 31 kg."],
    ["d2","datos",0,"Comprado a los 2 meses a un vecino que tenía una camada."],
    ["m1","motivo",1,"Desde hace unos 3 meses Thor pelea con Max, el otro macho de la casa: gruñen, se tiran encima y se muerden; Max ya tuvo una herida en la oreja."],
    ["m2","motivo",1,"Las peleas ocurren sobre todo en el pasillo angosto que lleva al patio, en la puerta cuando llega alguien y cuando hay huesos o comida."],
    ["m3","motivo",1,"Antes de esos 3 meses convivían sin problema."],
    ["o1","objetivo",1,"Que los dos perros puedan seguir viviendo juntos sin pelear; no quiere regalar a ninguno."],
    ["a1","antecedentes",1,"Otro veterinario le recomendó castrar a Thor y no lo hizo porque \"le quitaría la hombría\"."],
    ["a2","antecedentes",1,"Cuando pelean los separa a gritos, con la manguera o con un palo."],
    ["s1","salud",1,"Max, el otro perro, tiene 8 años y \"camina tieso\" por las mañanas y le cuesta subir las gradas; no lo han revisado."],
    ["s2","salud",0,"Thor tuvo garrapatas y una enfermedad de la sangre tratada hace un año; ahora sano, vacunas al día."],
    ["v1","vida",0,"Casa con patio grande en la vía a Quevedo; los perros pasan el día en el patio y entran a la casa en la noche."],
    ["c1","convivencia",1,"Viven el tutor, su esposa y dos hijos de 7 y 10 años; los niños juegan con los perros en el patio."],
    ["c2","convivencia",1,"Max es macho entero, mestizo, 8 años, llegó antes que Thor."],
    ["am1","ambiente",1,"Hace unos 3 meses la perra de los vecinos estuvo en celo; los perros pasaban ladrando en la cerca."],
    ["al1","alimentario",1,"Les da de comer a los dos al mismo tiempo, en el mismo rincón, y cada uno se acerca al plato del otro."],
    ["al2","alimentario",0,"Croquetas y sobras de la comida casera, una vez al día en la tarde."],
    ["di1","dipsico",0,"Un balde de agua en el patio que comparten."],
    ["so1","somato",0,"No hay lamido excesivo."],
    ["e1","eliminatorio",1,"Desde hace unos meses Thor levanta la pata y orina en la puerta y en las patas de los muebles al entrar a la casa."],
    ["su1","sueno",0,"Duermen en la lavandería, cada uno en su cobija."],
    ["ag1","agresion",1,"Antes de pelear Thor se pone rígido, levanta la cola, mira fijo a Max y gruñe; Max a veces se aparta y a veces responde."],
    ["ag2","agresion",0,"Con las personas, incluidos los niños, Thor es tranquilo."],
    ["ex1","exploratorio",0,"Sale poco a pasear porque \"tira mucho de la correa\"."],
    ["j1","juego",0,"Juega con los niños con una pelota de caucho."],
    ["sx1","sexual",1,"Thor monta a Max y a veces intenta montar el cojín del sillón."],
    ["ot1","otros",0,"No tiene miedos marcados."],
  ]
},
{
  id:"luna",especie:"Perro",paciente:"Luna",resumen:"Hembra schnauzer miniatura de 9 años",
  tutor:{nombre:"Martha Cedeño",rol:"tutora",personalidad:"Profesora jubilada de 63 años, muy detallista, conversadora y emotiva. Se desvía a contar anécdotas de Pepe, el perro que murió. Habla despacio y con cariño."},
  recepcion:"La tutora refiere que la perra \"se lame las patas hasta hacerse heridas\".",
  saludo:"Buenas tardes. Vengo con mi Lunita. Se lame las patitas de adelante todo el día, ya se hizo heridas, y yo ya no sé qué hacer.",
  hechos:[

// Busca si algún integrante ya tiene una entrega de esa especie en otro registro.
function choqueMiembros(lista,especie,miembros,aid){

}

let voces=[];
function cargarVoces(){try{voces=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang));}catch(e){voces=[];}}
if(TTS){cargarVoces();try{speechSynthesis.onvoiceschanged=cargarVoces;}catch(e){}}
function elegirVoz(rol){
  if(!voces.length)cargarVoces();
  const pref=["es-EC","es-US","es-419","es-MX","es-CO","es-PE","es-ES"];
  const fem=/female|mujer|paulina|monica|mónica|helena|laura|sabina|dalia|elvira|lupe|paloma|marisol|google español de estados unidos/i;
  const masc=/\bmale\b|hombre|jorge|diego|pablo|juan|carlos|raul|raúl|alvaro|álvaro|enrique|andrés/i;
  const byLang=pref.map(l=>voces.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(l.toLowerCase()))).flat().concat(voces);
  const want=rol==="tutora"?fem:masc;
  return byLang.find(v=>want.test(v.name))||byLang[0]||null;
}
function hablar(texto,rol){
  if(!TTS||!texto)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(texto);const v=elegirVoz(rol);u.lang=v?v.lang:"es-EC";if(v){try{u.voice=v;}catch(e){}}u.rate=1;u.pitch=rol==="tutora"?1.08:0.92;speechSynthesis.speak(u);}catch(e){}
}
function callar(){if(TTS)try{speechSynthesis.cancel();}catch(e){}}

function metrics(st=S){
  const c=caseOf(st.caseId),keys=keyFacts(c),rev=new Set(st.revelados||[]);
  const got=keys.filter(h=>rev.has(h[0])).length;
  const preguntas=st.chat.length,abiertas=st.chat.filter(m=>m.tipo==="abierta").length,inductivas=st.chat.filter(m=>m.tipo==="inductiva").length;
  const porCat={};keys.forEach(h=>{porCat[h[1]]=porCat[h[1]]||[0,0];porCat[h[1]][1]++;if(rev.has(h[0]))porCat[h[1]][0]++;});
  return{cobertura:keys.length?Math.round(100*got/keys.length):0,got,total:keys.length,preguntas,abiertas,inductivas,pistas:(st.pistas||[]).length,porCat};
}

function save(){
  if(!S)return;
  S.updatedAt=Date.now();lsSet();
}

function recordFrom(st){
  const c=caseOf(st.caseId);
  const m=metrics(st);
  const rub=(st.fb2&&st.fb2.rubrica)||{};
  const key=groupKey(c.especie,st.paralelo,st.grupo);
  const record={
    nombre:nombresTexto(st),integrantes:miembrosDe(st),paralelo:st.paralelo||"",grupo:st.grupo||"",
    especie:c.especie,paciente:c.paciente,caseId:st.caseId,
    cobertura:m.cobertura,preguntas:m.preguntas,abiertas:m.abiertas,inductivas:m.inductivas,pistas:m.pistas,
    completitud:rub.completitud||0,motivo:rub.motivo||0,clasificacion:rub.clasificacion||0,objetividad:rub.objetividad||0,ambiente:rub.ambiente||0,
    repaso:(st.repaso&&st.repaso.aciertos)||0,
    startedAt:st.startedAt,entregadoAt:st.entregado||Date.now(),
    aid:st.aid,evaluada:!!(st.fb2&&st.fb2.rubrica)
  };
  record.nota=notaDe(record);
  return{key,record};
}
async function saveGradeRecord(){
  const{key,record}=recordFrom(S);
  lsSetGrade(key,record);
  S._enLinea=false;
  if(caps.db&&caps.canWrite){
    try{await caps.db.doc("grades/"+key).set({...record,fuente:"automatica"});S._enLinea=true;}catch(e){console.warn("saveGrade error",e);}
  }
}

function setSteps(){
  const order=["repaso","entrevista","redaccion","retro","revision","final"];
  const f=S?(S.fase==="retro2"?"final":S.fase):null;
  const i=order.indexOf(f);
  document.querySelectorAll("#steps li").forEach((li,k)=>{li.className=(view==="alumno"&&i>=0)?(k<i?"done":(k===i?"on":"")):"";});
  $("#steps").hidden=view!=="alumno";
}

function render(){
  app.oninput=null;
  if(!S||S.fase!=="entrevista"||view!=="alumno")callar();
  setSteps();
  $("#btnDocente").hidden=(view!=="alumno");
  $("#btnAlumno").hidden=(view!=="docente");
  if(view==="docente")return renderDocente();
  // Pantalla de login: caps ya inicializados, estamos en claude.ai pero sin sesión
  if(caps._ready&&!caps.sample&&caps._hasClaude&&!S)return renderLogin();
  if(!S)return renderInicio();
  if(S.fase==="repaso"&&S.repaso)return renderRepasoResultado();
  ({repaso:renderRepaso,entrevista:renderEntrevista,redaccion:renderRedaccion,retro:renderRetro,revision:renderRedaccion,final:renderFinal})[S.fase]();
}

async function ask(){
  if(busy)return;
  if(!caps.sample){toast("Para interactuar con el tutor debes abrir esta práctica en claude.ai con tu cuenta iniciada sesión.");return;}
  const q=$("#q"),text=q.value.trim();if(!text)return;
  if(S.chat.length>=MAX_PREGUNTAS)return;
  busy=true;$("#send").disabled=true;q.value="";
  const c=caseOf(S.caseId);
  drawLog(`<div class="msg me"><span class="who">Tú</span>${esc(text)}</div><div class="typing">${esc(c.tutor.nombre)} está respondiendo...</div>`);
  try{
    const r=await caps.sample.json(tutorPrompt(c,text),{cache:false,modelTier:"default"});
    const a=(r&&typeof r.respuesta==="string"&&r.respuesta.trim())?r.respuesta.trim():"Disculpe, no le entendí bien. ¿Me puede repetir la pregunta?";
    const valid=new Set(c.hechos.map(h=>h[0]));
    const rev=Array.isArray(r?.revelados)?r.revelados.filter(x=>valid.has(x)):[];
    const tipo=["abierta","cerrada","inductiva","otra"].includes(r?.tipo)?r.tipo:"otra";
    S.chat.push({q:text,a,tipo,revelados:rev,t:Date.now()});
    S.revelados=[...new Set([...(S.revelados||[]),...rev])];
    save();if(vozOn)hablar(a,c.tutor.rol);
  }catch(e){
    q.value=text;
    const msg=e?.code==="rate_limited"?"Se alcanzó el límite de uso por un momento. Espera un minuto e intenta de nuevo.":e?.code==="not_granted"?"No se concedió permiso para usar Claude en esta página. Ábrela de nuevo y acepta el permiso.":"No se pudo obtener la respuesta del tutor. Intenta enviar la pregunta otra vez.";
    toast(msg);
  }
  busy=false;renderEntrevista();const nq=$("#q");if(nq&&!nq.disabled)nq.focus();
}
function pista(){
  const c=caseOf(S.caseId),rev=new Set(S.revelados);
  if((S.pistas||[]).length>=MAX_PISTAS)return;
  const order=["motivo","datos","antecedentes","salud","vida","convivencia","ambiente","alimentario","dipsico","somato","eliminatorio","sueno","agresion","exploratorio","juego","sexual","maternal","objetivo","otros"];
  const usadas=new Set((S.pistas||[]).map(p=>p.cat));
  const falta=order.find(cat=>!usadas.has(cat)&&keyFacts(c).some(h=>h[1]===cat&&!rev.has(h[0])));
  const cat=falta||"otros";
  const texto=falta?PISTA[cat]:"Revisa tu guía: ¿quedó algún apartado de la historia sin explorar a fondo?";
  S.pistas.push({n:S.pistas.length+1,cat,texto,turno:S.chat.length,t:Date.now()});
  save();renderEntrevista();
}

      <div class="stat"><span class="mono">${m.preguntas}</span>Preguntas realizadas</div>
      <div class="stat"><span class="mono">${m.preguntas?Math.round(100*m.abiertas/m.preguntas):0}%</span>Preguntas abiertas</div>
      <div class="stat"><span class="mono">${m.inductivas}</span>Preguntas inductivas</div>

}

function declaracion(st=S){
  const c=caseOf(st.caseId),m=metrics(st);
  const f=(t)=>t?new Date(t).toLocaleString("es-EC"):"";
  return`DECLARACIÓN DE USO DE IA (nivel IAA, uso acotado)
Integrantes: ${nombresTexto(st)}${grupoTexto(st)?"\n"+grupoTexto(st):""}
Temas 1.2 y 1.3: Clasificación de los comportamientos y elaboración de la historia clínica etológica
Paciente simulado: ${c.paciente} (${c.especie==="Perro"?"canino":"felino"})
Herramienta: Claude (Anthropic), integrada en la aplicación de la práctica.
Fines de uso: 1) simular al tutor durante la entrevista (${m.preguntas} preguntas, ${m.pistas} pistas); 2) generar retroalimentación socrática sobre la versión 1 y comentarios sobre la versión final. El repaso del tema 1.2 se respondió sin IA.
La IA no redactó la historia clínica ni clasificó las conductas. Ambas versiones fueron escritas por los integrantes del grupo.
Inicio: ${f(st.startedAt)} · Entrega: ${f(st.entregado)}`;
}

function registroTexto(st){
  const c=caseOf(st.caseId);
  const tx=[`${c.tutor.nombre}: ${c.saludo}`].concat(st.chat.map(t=>`Estudiante: ${t.q}\n${c.tutor.nombre}: ${t.a}`)).join("\n");
  const pist=(st.pistas||[]).map(p=>`Pista ${p.n} (tras la pregunta ${p.turno}): ${p.texto}`).join("\n")||"Ninguna";
  return`${declaracion(st)}\n\n=== TRANSCRIPCIÓN ===\n${tx}\n\n=== PISTAS ===\n${pist}\n\n=== VERSIÓN 1 ===\n${st.v1?historiaTexto(st.v1):""}\n\n=== VERSIÓN FINAL ===\n${st.v2?historiaTexto(st.v2):""}\n`;
}
const MARCA_INI="=== DATOS PARA IMPORTAR (no modificar) ===",MARCA_FIN="=== FIN DE DATOS ===";
const b64e=(t)=>btoa(unescape(encodeURIComponent(t)));
const b64d=(t)=>decodeURIComponent(escape(atob(t)));
async function huella(json){
  const t="hce-ute-1.2-1.3|"+json;let out="";
  for(const seed of[0x811c9dc5,0x01000193,0x9e3779b9]){let h=seed>>>0;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}out+=h.toString(16).padStart(8,"0");}
  return out;
}
async function registroCompleto(st){
  const limpio=JSON.parse(JSON.stringify(st));delete limpio._saveErr;delete limpio.v1draft;delete limpio.v2draft;delete limpio.guia;
  const json=JSON.stringify(limpio);const b=b64e(json).replace(/(.{76})/g,"$1\n");
  return`${registroTexto(st)}\n${MARCA_INI}\n${b}\n${await huella(json)}\n${MARCA_FIN}\n`;
}
function sampleFlat(){
  const call=async(input)=>{try{return String(await window.claude.complete(typeof input==="string"?input:JSON.stringify(input)));}catch(e){throw{code:/limit|rate/i.test(String(e&&(e.message||e)))?"rate_limited":"error",message:String(e&&(e.message||e))};}};
  const f=async(input)=>({text:await call(input),truncated:false});
  f.json=async(input)=>{const raw=(await call(input)).trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");try{return JSON.parse(raw);}catch(e){}const i=raw.indexOf("{"),j=raw.lastIndexOf("}");if(i>=0&&j>i){try{return JSON.parse(raw.slice(i,j+1));}catch(e){}}throw{code:"invalid_json",text:raw};};
  return f;
}
async function descargar(data,filename){
  if(caps.downloads){try{await caps.downloads.save({filename,data});return;}catch(e){if(e?.code==="cancelled")return;}}
  try{const url=URL.createObjectURL(new Blob([data],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);}catch(e){}
  mostrarTexto(data,filename);
}
function mostrarTexto(data,filename){
  const m=$("#modal");
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="panel stack" style="max-width:720px"><h3>Tu registro completo</h3>
    <p class="muted" style="font-size:.92rem">Si la descarga no empezó, selecciona todo el texto (Cmd+A o Ctrl+A dentro del cuadro), cópialo y pégalo en un documento de texto llamado <b>${esc(filename)}</b>. Súbelo a la plataforma del curso.</p>
    <textarea id="regTxt" readonly style="min-height:260px;font-family:var(--f-mono);font-size:.8rem">${esc(data)}</textarea>
    <div class="row" style="justify-content:flex-end"><button class="btn-ghost" id="regSel">Seleccionar todo</button><button class="btn" id="regOk">Cerrar</button></div></div></div>`;
  $("#regSel").onclick=()=>{const t=$("#regTxt");t.focus();t.select();};
  $("#regOk").onclick=()=>m.innerHTML="";
}

// -------- Panel docente --------
async function loadAllGrades(){
  const grades=[];
  if(caps.db&&caps.canRead){
    try{
      const snap=await caps.db.collection("grades").get();
      snap.docs.forEach(d=>grades.push({key:d.id,...d.data()}));
    }catch(e){}
  }
  // Complementar con localStorage
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith("hc-grade:")){
        const key=k.slice("hc-grade:".length);
        if(!grades.find(g=>g.key===key)){
          try{const v=JSON.parse(localStorage.getItem(k));if(v)grades.push({key,...v});}catch(e){}
        }
      }
    }
  }catch(e){}
  grades.sort((a,b)=>(b.entregadoAt||0)-(a.entregadoAt||0));
  return grades;
}
async function delGrade(key){
  if(caps.db&&caps.canWrite){try{await caps.db.doc("grades/"+key).delete();}catch(e){}}
  lsDelGrade(key);
}
function parseRegistro(text){
  const i=text.indexOf(MARCA_INI),j=text.indexOf(MARCA_FIN);
  if(i<0||j<i)return{error:"No contiene el bloque de datos para importar."};
  const lines=text.slice(i+MARCA_INI.length,j).split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return{error:"El bloque de datos está incompleto."};
  const hash=lines.pop();let json;
  try{json=b64d(lines.join(""));}catch(e){return{error:"El bloque de datos está dañado."};}
  let st;try{st=JSON.parse(json);}catch(e){return{error:"El bloque de datos está dañado."};}
  if(!st||!caseOf(st.caseId))return{error:"El registro no corresponde a esta práctica."};
  return{st,json,hash};
}
async function importarTextos(textos){
  const res=[];
  for(const{nombre,text}of textos){
    const p=parseRegistro(text);
    if(p.error){res.push({archivo:nombre,ok:false,msg:p.error});continue;}
    const integro=(await huella(p.json))===p.hash;
    const{key,record}=recordFrom(p.st);
    record.fuente="importada";record.integro=integro;record.importadoAt=Date.now();
    let existente=null;
    if(caps.db&&caps.canRead){try{const d=await caps.db.doc("grades/"+key).get();if(d.exists)existente=d.data();}catch(e){}}
    if(!existente)existente=lsGetGrade(key);
    if(existente&&existente.aid!==record.aid){res.push({archivo:nombre,ok:false,msg:`${grupoTexto(record)} ya tiene una entrega de paciente ${record.especie==="Perro"?"canino":"felino"}. Se mantiene la primera; elimínala si quieres reemplazarla.`});continue;}
    const choque=choqueMiembros(await loadAllGrades(),record.especie,miembrosDe(record),record.aid);
    if(choque){res.push({archivo:nombre,ok:false,msg:`${choque.hit} ya aparece en la entrega de ${grupoTexto(choque.g)||"otro grupo"} para paciente ${record.especie==="Perro"?"canino":"felino"}. Se mantiene la primera.`});continue;}
    lsSetGrade(key,record);
    let guardado=false;
    if(caps.db&&caps.canWrite){try{await caps.db.doc("grades/"+key).set(record);guardado=true;}catch(e){}}
    res.push({archivo:nombre,ok:true,msg:`${grupoTexto(record)} (${nombresTexto(record)}): ${record.nota}/10${integro?"":" · el bloque de datos fue modificado, revísalo"}${guardado?"":" · guardado solo en este navegador"}`});
  }
  return res;
}
async function renderDocente(){
  app.innerHTML=`<section class="panel stack" style="max-width:640px;margin:30px auto;text-align:center"><span class="eyebrow">Panel docente</span><h2>Cargando registros...</h2></section>`;

      <td class="mono">${g.cobertura||0}%</td>
      <td class="mono">${g.preguntas||0}</td>
      <td class="mono">${g.pistas||0}</td>
      ${rub}
      <td class="mono" style="font-weight:700">${g.nota!=null?g.nota:notaDe(g)}</td>
      <td>${g.fuente==="importada"?`<span class="pill ${g.integro===false?"inc":"fin"}">${g.integro===false?"Revisar":"Importada"}</span>`:`<span class="pill fin">Automática</span>`}</td>
      <td>${f(g.entregadoAt)}</td>
      <td><button class="btn-coral btn-sm" data-delkey="${esc(g.key)}">Eliminar</button></td>

  app.innerHTML=`<div class="stack">

      <p class="muted">Descarga de la plataforma del curso los registros .txt que subieron tus estudiantes y cárgalos aquí. Puedes seleccionar varios a la vez. Cada registro se califica y se guarda en tu cuenta; si un estudiante ya tiene entrega de esa especie, se conserva la primera.</p>
      <div class="drop" id="drop">
        <div class="row"><label for="fileIn" class="btn-teal" style="margin:0;cursor:pointer;border-radius:10px;padding:.6rem 1rem">Seleccionar archivos .txt</label><input id="fileIn" type="file" accept=".txt,text/plain" multiple hidden><span class="muted">o arrástralos a este recuadro</span></div>
        <details><summary class="muted" style="cursor:pointer">Pegar el texto de un registro</summary><div class="stack" style="margin-top:8px"><textarea id="pasteIn" rows="5" placeholder="Pega aquí el registro completo, incluido el bloque de datos final"></textarea><div><button class="btn-ghost btn-sm" id="btnPaste">Importar texto pegado</button></div></div></details>
      </div>
      <div class="stack" id="impRes"></div>
    </section>
    <div class="row" style="justify-content:space-between">
      <h2>Calificaciones <span class="muted" style="font-size:1rem;font-weight:400">(${grades.length})</span></h2>
      <button class="btn-teal" id="btnCsvDl">Descargar CSV</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Integrantes</th><th>Paralelo</th><th>Grupo</th><th>Caso</th><th>Repaso</th><th>Cobertura</th><th>Preguntas</th><th>Pistas</th>${rubCols}<th>Nota /10</th><th>Origen</th><th>Fecha</th><th></th></tr></thead>
        <tbody id="tBody">${rows}</tbody>
      </table>
    </div>
  </div>`;

  document.querySelectorAll("[data-delkey]").forEach(btn=>{
    btn.onclick=()=>confirmBox(`¿Eliminar el registro de ${btn.closest("tr").querySelectorAll("td")[1].textContent?"Paralelo "+btn.closest("tr").querySelectorAll("td")[1].textContent+", ":""}Grupo ${btn.closest("tr").querySelectorAll("td")[2].textContent}? Esta acción no se puede deshacer.`,"Eliminar",async()=>{
      await delGrade(btn.dataset.delkey);renderDocente();
    });
  });

  const mostrarRes=(res)=>{$("#impRes").innerHTML=res.map(r=>`<div class="fb ${r.ok?"ok":""}"><b>${esc(r.archivo)}</b>${esc(r.msg)}</div>`).join("")+(res.some(r=>r.ok)?`<div><button class="btn-ghost btn-sm" id="btnRefresh">Actualizar tabla</button></div>`:"");if($("#btnRefresh"))$("#btnRefresh").onclick=()=>renderDocente();};
  const leer=async(files)=>{const textos=[];for(const f of files){try{textos.push({nombre:f.name,text:await f.text()});}catch(e){textos.push({nombre:f.name,text:""});}}if(!textos.length)return;$("#impRes").innerHTML=`<p class="muted">Importando ${textos.length} registro(s)...</p>`;mostrarRes(await importarTextos(textos));};
  $("#fileIn").onchange=(e)=>leer([...e.target.files]);
  const drop=$("#drop");
  drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("on");});
  drop.addEventListener("dragleave",()=>drop.classList.remove("on"));

  $("#btnPaste").onclick=async()=>{const t=$("#pasteIn").value;if(!t.trim())return;mostrarRes(await importarTextos([{nombre:"Texto pegado",text:t}]));};

    const header=["Estudiante","Paralelo","Grupo","Especie","Paciente","Repaso (/"+QUIZ.length+")","Cobertura%","Preguntas","Pistas",...RUBRICA.map(([,l])=>l+" (/4)"),"Nota (/10)","Origen","Fecha"].join(",");
    const csvRows=grades.flatMap(g=>miembrosDe(g).map(m=>{
      return[m,g.paralelo||"",g.grupo||"",g.especie||"",g.paciente||"",g.repaso||0,g.cobertura||0,g.preguntas||0,g.pistas||0,...RUBRICA.map(([k])=>g[k]||0),g.nota!=null?g.nota:notaDe(g),g.fuente==="importada"?(g.integro===false?"Importada (revisar)":"Importada"):"Automática",g.entregadoAt?new Date(g.entregadoAt).toLocaleDateString("es-EC"):""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",");
    }));
    const csv="\ufeff"+header+"\n"+csvRows.join("\n");
    const filename=`historia_clinica_calificaciones_${new Date().toISOString().slice(0,10)}.csv`;
    if(caps.downloads){try{await caps.downloads.save({filename,data:csv});return;}catch(e){if(e?.code==="cancelled")return;}}

// Solo el docente (cuenta propietaria) lee y escribe las calificaciones en la base de datos.
// Los estudiantes, aunque entren con su cuenta, guardan en su navegador y entregan su registro.
async function resolverAcceso(user){
  caps.canWrite=false;caps.canRead=false;canEdit=false;
  let owner=false;
  if(user){try{uid=await user.id();}catch(e){}try{canEdit=!!(await user.canEdit());}catch(e){}try{owner=!!(await user.isOwner());}catch(e){}}
  // Solo la cuenta propietaria (el docente) ve y guarda calificaciones, aunque los estudiantes sean Editores.
  if(caps.db&&owner){caps.canWrite=true;caps.canRead=true;}
}
